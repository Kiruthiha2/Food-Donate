name: React Firebase CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check if frontend directory exists
        id: check_frontend
        run: |
          if [ -d "frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install frontend dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm test -- --watchAll=false
        continue-on-error: true

      - name: Build frontend app
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd frontend
          CI=true npm run build

      - name: Deploy to Firebase Hosting (optional)
        if: steps.check_frontend.outputs.exists == 'true' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: your-firebase-project-id
